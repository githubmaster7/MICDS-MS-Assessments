<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICDS Peer Tutoring Club</title>
  <style>
    :root {
      --navy:     #1a2e5a;
      --navy-dk:  #111e3c;
      --gold:     #c9a84c;
      --gold-lt:  #f0e0a8;
      --bg:       #f3f5f9;
      --white:    #ffffff;
      --text:     #1e293b;
      --muted:    #64748b;
      --border:   #d1d5db;
      --blue-lt:  #dbeafe;
      --blue-dk:  #1d4ed8;
      --grn-lt:   #d1fae5;
      --grn-dk:   #065f46;
      --red-lt:   #fee2e2;
      --red-dk:   #991b1b;
      --amb-lt:   #fef3c7;
      --amb-dk:   #92400e;
      --shadow:   0 2px 10px rgba(0,0,0,0.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* ── Header ── */
    header{background:var(--navy);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:1.25rem;box-shadow:0 3px 12px rgba(0,0,0,0.25);position:sticky;top:0;z-index:100}
    .logo{width:48px;height:48px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;color:var(--navy);flex-shrink:0;letter-spacing:-1px}
    .hdr-text h1{font-size:1.25rem;font-weight:700}
    .hdr-text p{font-size:0.78rem;opacity:0.7;margin-top:1px}
    #user-info{margin-left:auto;display:flex;align-items:center;gap:0.65rem;flex-shrink:0}
    .user-name{font-size:0.82rem;opacity:0.85}
    .role-badge-hdr{font-size:0.68rem;font-weight:800;padding:0.2rem 0.6rem;border-radius:12px;text-transform:uppercase;letter-spacing:0.4px;background:var(--gold);color:var(--navy)}
    .btn-outline-white{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.5);padding:0.35rem 0.85rem;font-size:0.78rem;font-weight:600;border-radius:7px;cursor:pointer;transition:all 0.18s}
    .btn-outline-white:hover{background:rgba(255,255,255,0.15)}

    /* ── Nav ── */
    nav{background:var(--white);border-bottom:2px solid var(--border);padding:0 1.5rem;display:flex;overflow-x:auto}
    .tab-btn{padding:0.88rem 1.3rem;border:none;background:none;font-size:0.86rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .18s,border-color .18s;white-space:nowrap;display:flex;align-items:center;gap:0.4rem}
    .tab-btn:hover{color:var(--navy)}
    .tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:700}
    .tab-badge{background:var(--navy);color:#fff;font-size:0.66rem;font-weight:700;padding:0.12rem 0.48rem;border-radius:20px;min-width:18px;text-align:center}
    .tab-btn.active .tab-badge{background:var(--gold);color:var(--navy)}
    .tab-badge.hot{background:#f59e0b}

    /* ── Main / panels ── */
    #app{max-width:1080px;margin:2rem auto;padding:0 1.25rem 4rem}
    .tab-panel{display:none}
    .tab-panel.active{display:block}

    /* ── Auth screen ── */
    .auth-outer{display:flex;align-items:flex-start;justify-content:center;padding:2.5rem 1rem 4rem}
    .auth-card{background:var(--white);border-radius:16px;padding:2rem 2rem 2.25rem;box-shadow:0 4px 24px rgba(0,0,0,0.12);width:100%;max-width:450px}
    .auth-logo-row{display:flex;align-items:center;gap:0.85rem;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:2px solid var(--gold-lt)}
    .auth-brand{font-size:1.1rem;font-weight:800;color:var(--navy)}
    .auth-sub-txt{font-size:0.78rem;color:var(--muted);margin-top:2px}
    .auth-form-title{font-size:1.05rem;font-weight:700;color:var(--navy);margin-bottom:1.25rem}
    .auth-switch{font-size:0.82rem;color:var(--muted);margin-top:1.1rem;text-align:center}
    .auth-switch a{color:var(--navy);font-weight:600;text-decoration:none}
    .auth-switch a:hover{text-decoration:underline}
    .auth-hint{font-size:0.82rem;color:var(--muted);margin-bottom:1rem}
    .back-link{font-size:0.82rem;color:var(--muted);text-decoration:none;font-weight:600}
    .back-link:hover{color:var(--navy)}

    /* Role picker */
    .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:0.25rem}
    .role-card{background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:1rem 0.75rem;text-align:center;cursor:pointer;transition:all 0.18s;user-select:none}
    .role-card:hover{border-color:var(--navy);background:#eef1f8}
    .role-card.selected{border-color:var(--navy);background:var(--blue-lt)}
    .role-icon{font-size:1.75rem;margin-bottom:0.35rem}
    .role-lbl{font-size:0.88rem;font-weight:700;color:var(--navy)}
    .role-sublbl{font-size:0.72rem;color:var(--muted);margin-top:2px}

    /* ── Pending screen ── */
    .pending-outer{display:flex;align-items:flex-start;justify-content:center;padding:3rem 1rem}
    .pending-card{background:var(--white);border-radius:16px;padding:2.5rem 2rem;box-shadow:var(--shadow);max-width:420px;width:100%;text-align:center}
    .pending-icon{font-size:3rem;margin-bottom:1rem;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    .pending-card h2{font-size:1.15rem;font-weight:700;color:var(--navy);margin-bottom:0.6rem}
    .pending-card p{font-size:0.85rem;color:var(--muted);line-height:1.6;margin-bottom:0.5rem}

    /* ── Card ── */
    .card{background:var(--white);border-radius:14px;padding:1.5rem;box-shadow:var(--shadow);margin-bottom:1.5rem}
    .card-title{font-size:1.05rem;font-weight:700;color:var(--navy);margin-bottom:1.25rem;padding-bottom:0.85rem;border-bottom:2px solid var(--gold-lt);display:flex;align-items:center;gap:0.6rem}

    /* ── Form ── */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .fg{display:flex;flex-direction:column;gap:0.35rem}
    .fg.span2{grid-column:1/-1}
    label.lbl{font-size:0.76rem;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:0.4px}
    input[type=text],input[type=email],input[type=date],input[type=time],input[type=password],select{padding:0.6rem 0.9rem;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;color:var(--text);background:var(--white);outline:none;transition:border-color .18s,box-shadow .18s;width:100%}
    input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,46,90,0.1)}

    /* ── Pills ── */
    .pill-grid{display:flex;flex-wrap:wrap;gap:0.4rem}
    .pill-grid label{display:flex;align-items:center;gap:0.3rem;font-size:0.78rem;font-weight:500;background:var(--bg);padding:0.35rem 0.72rem;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);transition:all .15s;user-select:none}
    .pill-grid label:hover{border-color:var(--navy);background:#e8edf5}
    .pill-grid label:has(input:checked){background:var(--gold-lt);border-color:var(--gold);color:#7a5c00;font-weight:600}
    .pill-grid input[type=checkbox]{display:none}

    /* ── Buttons ── */
    .btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.62rem 1.25rem;border:none;border-radius:8px;font-size:0.86rem;font-weight:700;cursor:pointer;transition:all .18s}
    .btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-dk)}
    .btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:#b89036}
    .btn-green{background:var(--grn-lt);color:var(--grn-dk);border:1.5px solid #6ee7b7}.btn-green:hover{background:#a7f3d0}
    .btn-red{background:var(--red-lt);color:var(--red-dk);border:1.5px solid #fca5a5}.btn-red:hover{background:#fecaca}
    .btn-amber{background:var(--amb-lt);color:var(--amb-dk);border:1.5px solid #fcd34d}.btn-amber:hover{background:#fde68a}
    .btn-outline{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-outline:hover{background:var(--bg)}
    .btn-sm{padding:0.38rem 0.78rem;font-size:0.78rem}
    .btn-xs{padding:0.24rem 0.58rem;font-size:0.72rem}
    .btn-full{width:100%;justify-content:center;margin-top:1.1rem}

    /* ── Alerts ── */
    .alert{padding:0.78rem 1rem;border-radius:8px;font-size:0.83rem;font-weight:500;margin-bottom:1rem;display:none}
    .alert-ok{background:var(--grn-lt);color:var(--grn-dk);display:block}
    .alert-err{background:var(--red-lt);color:var(--red-dk);display:block}
    .alert-info{background:var(--amb-lt);color:var(--amb-dk);display:block}

    /* ── Person rows ── */
    .person-list{display:flex;flex-direction:column;gap:0.7rem}
    .person-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:0.9rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px}
    .person-name{font-size:0.93rem;font-weight:700;color:var(--navy)}
    .person-meta{font-size:0.76rem;color:var(--muted);margin-top:2px}
    .p-actions{display:flex;gap:0.4rem;flex-shrink:0;flex-wrap:wrap;align-items:flex-start}

    /* ── Tags ── */
    .tags{display:flex;flex-wrap:wrap;gap:0.28rem;margin-top:0.45rem}
    .tag{font-size:0.68rem;font-weight:600;padding:0.16rem 0.52rem;border-radius:12px}
    .tag-sub{background:var(--blue-lt);color:var(--blue-dk)}
    .tag-int{background:var(--grn-lt);color:var(--grn-dk)}
    .tag-shared{background:var(--gold-lt);color:#7a5c00}

    /* ── Empty state ── */
    .empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
    .empty .eico{font-size:2.5rem;margin-bottom:0.55rem}
    .empty h3{color:var(--text);font-size:0.93rem;margin-bottom:0.35rem}
    .empty p{font-size:0.81rem}

    /* ── Stats row ── */
    .stats-row{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .stat-chip{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:0.72rem 1rem;box-shadow:var(--shadow);min-width:105px}
    .stat-chip strong{display:block;font-size:1.55rem;color:var(--navy);line-height:1}
    .stat-chip span{font-size:0.76rem;color:var(--muted)}
    .stat-chip.amb{border-color:#fcd34d}.stat-chip.amb strong{color:var(--amb-dk)}
    .stat-chip.grn{border-color:#6ee7b7}.stat-chip.grn strong{color:var(--grn-dk)}

    /* ── Match cards ── */
    .match-card{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
    .match-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    .pair-num{font-size:0.78rem;font-weight:700;color:var(--muted)}
    .score-pill{background:var(--navy);color:#fff;font-size:0.76rem;font-weight:700;padding:0.22rem 0.72rem;border-radius:20px}
    .match-pair{display:grid;grid-template-columns:1fr 44px 1fr;gap:0.7rem;align-items:center}
    .match-person{padding:0.8rem 0.9rem;border-radius:8px;border:1.5px solid var(--border)}
    .match-person.student{border-color:#93c5fd;background:#eff6ff}
    .match-person.tutor{border-color:#6ee7b7;background:#f0fdf4}
    .role-lbl-inner{font-size:0.66rem;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.2rem}
    .match-person.student .role-lbl-inner{color:var(--blue-dk)}
    .match-person.tutor .role-lbl-inner{color:var(--grn-dk)}
    .match-name{font-size:0.92rem;font-weight:700}
    .match-meta{font-size:0.76rem;color:var(--muted);margin-top:2px}
    .match-arrow{text-align:center;font-size:1.35rem;color:var(--muted)}
    .match-tags{margin-top:0.8rem}

    /* ── Request cards ── */
    .req-card{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:0.9rem 1rem;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);margin-bottom:0.65rem}
    .req-card.pending{border-left:4px solid #f59e0b;background:#fffbeb}
    .req-card.approved{border-left:4px solid #10b981;background:#f0fdf4}
    .req-card.rejected{border-left:4px solid #ef4444;background:#fef2f2}
    .req-info{flex:1;min-width:0}
    .req-name{font-size:0.91rem;font-weight:700;color:var(--navy)}
    .req-meta{font-size:0.75rem;color:var(--muted);margin-top:2px}
    .req-actions{display:flex;gap:0.4rem;flex-shrink:0;flex-wrap:wrap;align-items:flex-start}
    .status-pill{display:inline-block;font-size:0.66rem;font-weight:800;padding:0.16rem 0.56rem;border-radius:12px;text-transform:uppercase;letter-spacing:0.4px;margin-left:0.45rem}
    .sp-pending{background:var(--amb-lt);color:var(--amb-dk)}
    .sp-approved{background:var(--grn-lt);color:var(--grn-dk)}
    .sp-rejected{background:var(--red-lt);color:var(--red-dk)}

    /* Best-match highlight */
    .tutor-card{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:0.85rem;box-shadow:var(--shadow);transition:border-color .2s}
    .tutor-card.best-match{border-color:var(--gold);border-left:4px solid var(--gold);background:#fffbf0}
    .best-match-badge{background:var(--gold);color:var(--navy);font-size:0.68rem;font-weight:800;padding:0.18rem 0.55rem;border-radius:12px;margin-left:0.5rem;text-transform:uppercase}
    .compat-score{font-size:0.78rem;font-weight:700;color:var(--navy);background:var(--blue-lt);padding:0.22rem 0.6rem;border-radius:12px}

    /* ── Session form (inline teacher approval) ── */
    .session-form{border-top:1.5px solid var(--border);margin-top:0.9rem;padding-top:0.9rem;overflow:hidden;max-height:0;transition:max-height .3s ease}
    .session-form.open{max-height:500px}
    .session-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:0.75rem}
    .session-actions{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.5rem}

    /* ── Permission slip ── */
    .slip-page{background:var(--white);border:2px solid #333;padding:2.25rem 2.5rem;margin-bottom:2rem;font-family:'Times New Roman',Georgia,serif;color:#111}
    .slip-hd{text-align:center;border-bottom:3px double #333;padding-bottom:1rem;margin-bottom:1.5rem}
    .slip-hd h1{font-size:1.3rem;font-weight:900;text-transform:uppercase;letter-spacing:1.5px}
    .slip-hd h2{font-size:0.95rem;font-weight:600;margin-top:0.3rem}
    .slip-hd p{font-size:0.8rem;color:#555;margin-top:0.25rem}
    .slip-doc-title{text-align:center;font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-decoration:underline;margin:1.2rem 0 1rem}
    .slip-body-txt{font-size:0.88rem;line-height:1.75;margin-bottom:0.75rem}
    .slip-details{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem 2.5rem;margin:1.1rem 0}
    .detail-row{display:flex;gap:0.5rem;align-items:baseline;font-size:0.86rem}
    .detail-key{font-weight:700;white-space:nowrap;font-size:0.8rem}
    .detail-val{border-bottom:1px solid #333;flex:1;padding-bottom:1px;min-width:60px}
    .slip-tbl{width:100%;border-collapse:collapse;margin:1.1rem 0;font-size:0.84rem}
    .slip-tbl th,.slip-tbl td{border:1px solid #333;padding:0.5rem 0.7rem;text-align:left}
    .slip-tbl th{background:#efefef;font-weight:800;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.3px}
    .slip-checks{margin:0.85rem 0}
    .chk-row{display:flex;align-items:flex-start;gap:0.6rem;font-size:0.86rem;line-height:1.5;margin-bottom:0.42rem}
    .chk-box{width:13px;height:13px;min-width:13px;border:1.5px solid #333;display:inline-block;margin-top:2px}
    .slip-sigs{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-top:2rem}
    .sig-line{border-top:1px solid #333;padding-top:0.35rem;font-size:0.75rem;color:#333}
    .sig-spc{height:2rem}
    .slip-footer{font-size:0.7rem;text-align:center;color:#777;margin-top:1.5rem;border-top:1px solid #ccc;padding-top:0.5rem}

    /* ── Print ── */
    @media print{
      body>*:not(#slip-print-area){display:none!important}
      #slip-print-area{display:block!important}
      .slip-page{page-break-after:always;border:none;padding:1.5cm;margin:0}
      .slip-page:last-child{page-break-after:avoid}
    }

    /* ── Responsive ── */
    @media(max-width:640px){
      .form-grid,.session-grid,.slip-details,.slip-sigs{grid-template-columns:1fr}
      .fg.span2{grid-column:1}
      .match-pair{grid-template-columns:1fr}
      .match-arrow{transform:rotate(90deg)}
      .role-grid{grid-template-columns:1fr 1fr}
      .req-card{flex-direction:column}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">PT</div>
  <div class="hdr-text">
    <h1>MICDS Peer Tutoring Club</h1>
    <p id="header-sub">Connecting Middle School Students &amp; Upper School Tutors</p>
  </div>
  <div id="user-info"></div>
</header>

<nav id="main-nav"></nav>
<main id="app"></main>
<div id="slip-print-area" style="display:none"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════════
const SUBJECTS  = ['Math','Science','English','History','Spanish','French','Biology','Chemistry','Physics','Computer Science','Art','Music'];
const INTERESTS = ['Reading','Gaming','Soccer','Basketball','Art','Music','Coding','Cooking','Film','Nature','Debate','Theater','Chess','Photography'];
const ACCESS_CODES = { teacher: 'MICDS-TEACH-2026', admin: 'MICDS-ADMIN-2026' };
const K_USERS = 'ptc_users', K_REQS = 'ptc_requests', K_SESSION = 'ptc_session';

// ═══════════════════════════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════════════════════════
const db = {
  get: k => JSON.parse(localStorage.getItem(k) || '[]'),
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
  users: ()   => db.get(K_USERS),
  reqs:  ()   => db.get(K_REQS),
  saveU: arr  => db.set(K_USERS, arr),
  saveR: arr  => db.set(K_REQS, arr),
};
const sess = {
  get:   () => JSON.parse(localStorage.getItem(K_SESSION) || 'null'),
  set:   u  => localStorage.setItem(K_SESSION, JSON.stringify(u)),
  clear: () => localStorage.removeItem(K_SESSION),
  refresh: () => {
    const s = sess.get();
    if (!s) return null;
    const fresh = db.users().find(u => u.id === s.id) || null;
    if (fresh) sess.set(fresh);
    return fresh;
  },
};

// ═══════════════════════════════════════════════════════════════════════════════
// SEED DEFAULT ACCOUNTS
// ═══════════════════════════════════════════════════════════════════════════════
function seedIfNeeded() {
  const users = db.users();
  if (users.find(u => u.email === 'admin@micds.org')) return;
  users.push(
    { id: uid(), role:'admin',   first:'Club',   last:'Admin',   grade:'', email:'admin@micds.org',   password:'admin',   subjects:[], interests:[], status:'approved', createdAt:new Date().toISOString() },
    { id: uid(), role:'teacher', first:'Demo',   last:'Teacher', grade:'', email:'teacher@micds.org', password:'teacher', subjects:[], interests:[], status:'approved', createdAt:new Date().toISOString() }
  );
  db.saveU(users);
}

// ═══════════════════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════════════════
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(t) {
  if (!t) return '—';
  const [h,m] = t.split(':').map(Number);
  return `${h>12?h-12:h||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function ordinal(n) { const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function tagsH(arr, cls) { return arr.map(x=>`<span class="tag ${cls}">${esc(x)}</span>`).join(''); }
function flash(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'alert alert-'+type;
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className='alert'; }, 4200);
}
function compat(a, b) {
  const sharedSubjects  = a.subjects.filter(s => b.subjects.includes(s));
  const sharedInterests = a.interests.filter(i => b.interests.includes(i));
  return { sharedSubjects, sharedInterests, score: sharedSubjects.length*2 + sharedInterests.length };
}
function buildPills(id, items) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = items.map(item=>`<label><input type="checkbox" value="${esc(item)}"><span>${esc(item)}</span></label>`).join('');
}
function getChecked(id) {
  return [...document.querySelectorAll(`#${id} input:checked`)].map(i=>i.value);
}

function boot() {
  seedIfNeeded();

  if (!user) { renderLanding(); return; }

  if (!fresh) { renderLanding(); return; }
  if ((fresh.role==='student'||fresh.role==='tutor') && fresh.status!=='approved') {

  }
  renderDashboard(fresh);
}

function setNav(tabs) {
  const nav = document.getElementById('main-nav');
  if (!tabs || !tabs.length) { nav.innerHTML=''; nav.style.display='none'; return; }
  nav.style.display='flex';
  nav.innerHTML = tabs.map(t=>`<button class="tab-btn" data-tab="${t.id}" onclick="switchTab('${t.id}')">${esc(t.label)}${t.badge!==undefined?` <span class="tab-badge${t.badge>0?' hot':''}" id="badge-${t.id}">${t.badge}</span>`:''}</button>`).join('');
}
function switchTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const panel = document.getElementById('panel-'+id);
  const btn   = document.querySelector(`[data-tab="${id}"]`);
  if (panel) panel.classList.add('active');
  if (btn)   btn.classList.add('active');
  // lazy-render
  const fn = TAB_RENDERS[id];
  if (fn) fn();
}
const TAB_RENDERS = {};

function setUserInfo(user) {
  const roleLabels = { student:'Student', tutor:'Tutor', teacher:'Teacher', admin:'Admin' };
  document.getElementById('user-info').innerHTML = `
    <span class="user-name">${esc(user.first)} ${esc(user.last)}</span>

function renderDashboard(user) {

    case 'tutor':   return buildTutorShell(user);
    case 'teacher': return buildTeacherShell(user);
    case 'admin':   return buildAdminShell(user);

}

function renderFindTutors(user) {
  const el = document.getElementById('panel-find');
  const tutors = db.users().filter(u=>u.role==='tutor'&&u.status==='approved');
  const existingReq = db.reqs().find(r=>r.studentId===user.id && r.status!=='rejected');

  if (!tutors.length) {
    el.innerHTML = `<div class="card"><div class="empty"><div class="eico">&#128218;</div><h3>No tutors available yet</h3><p>Check back after tutors have registered and been approved.</p></div></div>`;
    return;
  }

  // Score and sort tutors
  const scored = tutors.map(t=>({ tutor:t, ...compat(user,t) })).filter(x=>x.sharedSubjects.length>0);
  scored.sort((a,b)=>b.score-a.score);

  const disabled = existingReq ? 'disabled title="You already have an active request"' : '';

  let html = `<div class="card no-print">
    <div class="card-title">Find a Tutor</div>
    ${existingReq ? `<div class="alert alert-info" style="display:block">You have an active match request. <a href="#" onclick="switchTab('mymatch');return false">View it here</a>.</div>` : ''}

    <button class="btn btn-gold" ${existingReq?'disabled':''} onclick="autoMatchStudent('${user.id}')">&#9889; Find My Best Match</button>
  </div>`;

  if (!scored.length) {
    html += `<div class="card"><div class="empty"><div class="eico">&#128533;</div><h3>No compatible tutors found</h3><p>No approved tutors offer the subjects you need. Check your profile or wait for more tutors to join.</p></div></div>`;
  } else {
    html += scored.map((x,i) => `
      <div class="tutor-card" id="tc-${x.tutor.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap">
          <div>
            <span class="match-name">${esc(x.tutor.first)} ${esc(x.tutor.last)}</span>
            ${i===0 ? '<span class="best-match-badge">Best Match</span>' : ''}
            <div class="match-meta" style="margin-top:3px">Grade ${x.tutor.grade} &nbsp;&middot;&nbsp; Upper School</div>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem">
            <span class="compat-score">Score ${x.score}</span>
            <button class="btn btn-navy btn-sm" ${disabled} onclick="requestTutor('${user.id}','${x.tutor.id}')">Request Tutor</button>
          </div>
        </div>
        <div class="tags">
          <strong style="font-size:0.72rem;color:var(--muted);margin-right:0.3rem">Shared subjects:</strong>
          ${tagsH(x.sharedSubjects,'tag-shared')}
          ${x.sharedInterests.length ? `<strong style="font-size:0.72rem;color:var(--muted);margin-left:0.5rem;margin-right:0.3rem">Interests:</strong>${tagsH(x.sharedInterests,'tag-int')}` : ''}
        </div>
        <div class="tags" style="margin-top:0.4rem">
          <strong style="font-size:0.72rem;color:var(--muted);margin-right:0.3rem">All subjects:</strong>
          ${tagsH(x.tutor.subjects,'tag-sub')}
        </div>
      </div>`).join('');
  }
  el.innerHTML = html;
}

function autoMatchStudent(studentId) {
  const user   = db.users().find(u=>u.id===studentId);
  const tutors = db.users().filter(u=>u.role==='tutor'&&u.status==='approved');
  const scored = tutors.map(t=>({ tutor:t, ...compat(user,t) })).filter(x=>x.sharedSubjects.length>0);
  scored.sort((a,b)=>b.score-a.score);
  if (!scored.length) { alert('No compatible tutors found.'); return; }
  requestTutor(studentId, scored[0].tutor.id);
}

function requestTutor(studentId, tutorId) {
  const existing = db.reqs().find(r=>r.studentId===studentId && r.status!=='rejected');
  if (existing) { switchTab('mymatch'); return; }
  const student = db.users().find(u=>u.id===studentId);
  const tutor   = db.users().find(u=>u.id===tutorId);
  const c = compat(student, tutor);
  const req = {
    id: uid(), studentId, tutorId,
    score: c.score, sharedSubjects: c.sharedSubjects, sharedInterests: c.sharedInterests,
    status: 'pending', submittedAt: new Date().toISOString(),
    sessionDate:'', sessionStart:'', sessionEnd:'', sessionLocation:'', supervisingTeacher:'', processedAt:'', processedBy:'',
  };
  const reqs = db.reqs(); reqs.push(req); db.saveR(reqs);
  switchTab('mymatch');
}

  }

  const tutor   = db.users().find(u=>u.id===req.tutorId);
  const tutorName = tutor ? `${esc(tutor.first)} ${esc(tutor.last)}` : 'Unknown Tutor';
  const tutorGrade = tutor ? tutor.grade : '—';

  let html = `<div class="card"><div class="card-title">My Match Request</div>`;
  if (req.status==='pending') {
    html += `

          <div class="match-person student"><div class="role-lbl-inner">You (Student)</div><div class="match-name">${esc(user.first)} ${esc(user.last)}</div><div class="match-meta">Grade ${user.grade} &middot; Middle School</div></div>

          <div class="match-person tutor"><div class="role-lbl-inner">Tutor</div><div class="match-name">${tutorName}</div><div class="match-meta">Grade ${tutorGrade} &middot; Upper School</div></div>
        </div>

      </div>
      <p style="font-size:0.83rem;margin-bottom:0.35rem"><strong>Session:</strong> ${fmtDate(req.sessionDate)}</p>

function renderTeacherQueue(user) {
  const el   = document.getElementById('panel-tqueue');

function renderTeacherReqList(user, reqs) {
  const el = document.getElementById('teacher-req-list');
  if (!el) return;
  el.innerHTML = reqs.map(r=>{
    const student = db.users().find(u=>u.id===r.studentId);
    const tutor   = db.users().find(u=>u.id===r.tutorId);
    const sn = student ? `${esc(student.first)} ${esc(student.last)} (Gr. ${student.grade})` : 'Unknown';
    const tn = tutor   ? `${esc(tutor.first)} ${esc(tutor.last)} (Gr. ${tutor.grade})`   : 'Unknown';
    const today3 = new Date(Date.now()+3*86400000).toISOString().split('T')[0];
    return `
      <div class="req-card pending" id="rcard-${r.id}">
        <div class="req-info" style="width:100%">
          <div class="req-name">${sn} &#8644; ${tn}</div>
          <div class="req-meta">Subjects: ${r.sharedSubjects.join(', ')} &middot; Submitted ${fmtDate(r.submittedAt.split('T')[0])}</div>
          <div class="tags" style="margin-top:0.4rem">${tagsH(r.sharedSubjects,'tag-shared')}${tagsH(r.sharedInterests,'tag-int')}</div>
          <div class="req-actions" style="margin-top:0.65rem">
            <button class="btn btn-green btn-sm" onclick="showSessionForm('${r.id}','${user.id}')">&#10003; Approve</button>
            <button class="btn btn-red btn-sm"   onclick="rejectMatchReq('${r.id}','${user.id}')">&#10007; Reject</button>
          </div>
          <div class="session-form" id="sf-${r.id}">
            <div style="font-size:0.82rem;font-weight:700;color:var(--navy);margin-bottom:0.65rem">Session Details</div>
            <div class="session-grid">
              <div class="fg"><label class="lbl">Date</label><input type="date" id="sf-date-${r.id}" value="${today3}"></div>
              <div class="fg"><label class="lbl">Location</label><input type="text" id="sf-loc-${r.id}" value="MICDS Library"></div>
              <div class="fg"><label class="lbl">Start Time</label><input type="time" id="sf-start-${r.id}" value="15:30"></div>
              <div class="fg"><label class="lbl">End Time</label><input type="time" id="sf-end-${r.id}" value="17:00"></div>
              <div class="fg span2"><label class="lbl">Supervising Teacher</label><input type="text" id="sf-teacher-${r.id}" value="${esc(user.first+' '+user.last)}"></div>
            </div>
            <div class="session-actions">
              <button class="btn btn-green btn-sm" onclick="confirmApproval('${r.id}','${user.id}')">Confirm &amp; Approve</button>
              <button class="btn btn-outline btn-sm" onclick="closeSessionForm('${r.id}')">Cancel</button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function showSessionForm(reqId, userId) {
  const sf = document.getElementById('sf-'+reqId);
  if (sf) { sf.classList.add('open'); }
}
function closeSessionForm(reqId) {
  const sf = document.getElementById('sf-'+reqId);
  if (sf) sf.classList.remove('open');
}

function confirmApproval(reqId, userId) {
  const date    = (document.getElementById('sf-date-'+reqId)||{}).value || '';
  const loc     = (document.getElementById('sf-loc-'+reqId)||{}).value || '';
  const start   = (document.getElementById('sf-start-'+reqId)||{}).value || '';
  const end     = (document.getElementById('sf-end-'+reqId)||{}).value || '';
  const teacher = (document.getElementById('sf-teacher-'+reqId)||{}).value || '';
  if (!date||!loc||!start||!end||!teacher) { alert('Please fill in all session details.'); return; }

  const reqs = db.reqs();
  const idx  = reqs.findIndex(r=>r.id===reqId);
  if (idx<0) return;
  Object.assign(reqs[idx], { status:'approved', sessionDate:date, sessionLocation:loc, sessionStart:start, sessionEnd:end, supervisingTeacher:teacher, processedAt:new Date().toISOString(), processedBy:userId });
  db.saveR(reqs);
  const user = db.users().find(u=>u.id===userId);
  renderTeacherQueue(user);
}

function rejectMatchReq(reqId, userId) {
  const reqs = db.reqs();
  const idx  = reqs.findIndex(r=>r.id===reqId);
  if (idx<0) return;
  Object.assign(reqs[idx], { status:'rejected', processedAt:new Date().toISOString(), processedBy:userId });
  db.saveR(reqs);
  const user = db.users().find(u=>u.id===userId);
  renderTeacherQueue(user);
}

function renderTeacherApproved(user) {
  const el   = document.getElementById('panel-tapproved');
  const reqs = db.reqs().filter(r=>r.status==='approved');
  reqs.sort((a,b)=>new Date(b.processedAt)-new Date(a.processedAt));
  if (!reqs.length) {
    el.innerHTML = `<div class="card"><div class="empty"><div class="eico">&#128196;</div><h3>No approved sessions yet</h3><p>Approved sessions and permission slips will appear here.</p></div></div>`;
    return;
  }
  el.innerHTML = reqs.map(r=>{
    const student = db.users().find(u=>u.id===r.studentId);
    const tutor   = db.users().find(u=>u.id===r.tutorId);
    const sn = student ? `${esc(student.first)} ${esc(student.last)} (Gr. ${student.grade})` : 'Unknown';
    const tn = tutor   ? `${esc(tutor.first)} ${esc(tutor.last)} (Gr. ${tutor.grade})`   : 'Unknown';
    return `<div class="card" style="margin-bottom:1rem">
      <div class="card-title" style="margin-bottom:0.85rem">${sn} &#8644; ${tn}</div>
      <p style="font-size:0.83rem;margin-bottom:0.3rem"><strong>Date:</strong> ${fmtDate(r.sessionDate)}</p>
      <p style="font-size:0.83rem;margin-bottom:0.3rem"><strong>Time:</strong> ${fmtTime(r.sessionStart)} – ${fmtTime(r.sessionEnd)}</p>
      <p style="font-size:0.83rem;margin-bottom:1rem"><strong>Location:</strong> ${esc(r.sessionLocation)}</p>
      <button class="btn btn-navy btn-sm" onclick="printSlip('${r.id}')">&#128424; Print Permission Slip</button>
      <div style="margin-top:1.25rem">${slipHTML(r,student,tutor)}</div>
    </div>`;
  }).join('');
}

function renderAdminPending(user) {
  const el      = document.getElementById('panel-apending');

function renderAdminUsers(user) {
  const el    = document.getElementById('panel-ausers');
  const users = db.users().filter(u=>u.id!==user.id);
  users.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  }

    ${users.map(u=>adminUserCard(u,'all')).join('')}</div>`;

function adminUserCard(u, context) {
  const roleLabels = { student:'Student', tutor:'Tutor', teacher:'Teacher', admin:'Admin' };
  const spClass    = { pending:'sp-pending', approved:'sp-approved', rejected:'sp-rejected' };
  const isStudTutor = u.role==='student'||u.role==='tutor';
  const gradeStr   = u.grade ? ` &middot; Grade ${u.grade}` : '';

  let actions = '';
  if (context==='pending') {
    actions = `<button class="btn btn-green btn-xs" onclick="adminSetStatus('${u.id}','approved')">Approve</button>
               <button class="btn btn-red btn-xs"   onclick="adminSetStatus('${u.id}','rejected')">Reject</button>
               <button class="btn btn-outline btn-xs" onclick="adminDelete('${u.id}')">Delete</button>`;
  } else if (isStudTutor) {
    actions = `${u.status!=='approved' ? `<button class="btn btn-green btn-xs" onclick="adminSetStatus('${u.id}','approved')">Approve</button>` : ''}
               ${u.status!=='rejected' ? `<button class="btn btn-red btn-xs" onclick="adminSetStatus('${u.id}','rejected')">Reject</button>` : ''}
               <button class="btn btn-outline btn-xs" onclick="adminDelete('${u.id}')">Delete</button>`;
  } else {
    actions = `<button class="btn btn-outline btn-xs" onclick="adminDelete('${u.id}')">Delete</button>`;
  }

  const submitted = u.createdAt ? fmtDate(u.createdAt.split('T')[0]) : '';

  return `<div class="req-card ${isStudTutor?u.status:'approved'}" style="margin-bottom:0.6rem">
    <div class="req-info">
      <div class="req-name">${esc(u.first)} ${esc(u.last)} <span class="role-badge-hdr" style="font-size:0.62rem">${roleLabels[u.role]||u.role}</span>${isStudTutor?`<span class="status-pill ${spClass[u.status]||'sp-pending'}">${u.status}</span>`:''}
      </div>
      <div class="req-meta">${esc(u.email)}${gradeStr}${submitted?' &middot; '+submitted:''}</div>
      ${u.subjects&&u.subjects.length ? `<div class="tags" style="margin-top:0.4rem">${tagsH(u.subjects,'tag-sub')}${tagsH(u.interests||[],'tag-int')}</div>` : ''}
    </div>
    <div class="req-actions" style="flex-direction:column">${actions}</div>
  </div>`;
}

function adminSetStatus(userId, status) {
  const users = db.users();
  const idx   = users.findIndex(u=>u.id===userId);
  if (idx<0) return;
  users[idx].status = status;
  db.saveU(users);
  const admin = sess.get();
  // Rebuild the panel that's currently active
  const activePanel = document.querySelector('.tab-panel.active');
  if (activePanel && activePanel.id==='panel-apending') renderAdminPending(admin);
  else if (activePanel && activePanel.id==='panel-ausers') renderAdminUsers(admin);
}

function adminDelete(userId) {
  if (!confirm('Permanently delete this user?')) return;
  const users = db.users().filter(u=>u.id!==userId);
  db.saveU(users);
  const admin = sess.get();
  const activePanel = document.querySelector('.tab-panel.active');
  if (activePanel && activePanel.id==='panel-apending') renderAdminPending(admin);
  else renderAdminUsers(admin);
}

function renderAdminReqs(user) {
  const el   = document.getElementById('panel-areqs');
  const reqs = db.reqs();
  reqs.sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
  if (!reqs.length) {
    el.innerHTML = `<div class="card"><div class="empty"><div class="eico">&#128203;</div><h3>No match requests yet</h3></div></div>`;
    return;
  }
  const spClass = { pending:'sp-pending', approved:'sp-approved', rejected:'sp-rejected' };
  el.innerHTML = `<div class="card"><div class="card-title">All Match Requests (${reqs.length})</div>
    ${reqs.map(r=>{
      const student = db.users().find(u=>u.id===r.studentId);
      const tutor   = db.users().find(u=>u.id===r.tutorId);
      const sn = student ? `${esc(student.first)} ${esc(student.last)} (Gr. ${student.grade})` : 'Unknown';
      const tn = tutor   ? `${esc(tutor.first)} ${esc(tutor.last)} (Gr. ${tutor.grade})`   : 'Unknown';
      return `<div class="req-card ${r.status}" style="margin-bottom:0.6rem">
        <div class="req-info">
          <div class="req-name">${sn} &#8644; ${tn} <span class="status-pill ${spClass[r.status]}">${r.status}</span></div>
          <div class="req-meta">Score ${r.score} &middot; ${r.sharedSubjects.join(', ')} &middot; ${fmtDate(r.submittedAt.split('T')[0])}</div>
          ${r.status==='approved'?`<div class="req-meta">Session: ${fmtDate(r.sessionDate)} &middot; ${esc(r.sessionLocation)}</div>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PERMISSION SLIP
// ═══════════════════════════════════════════════════════════════════════════════
function slipHTML(req, student, tutor) {
  const sFirst = student ? esc(student.first) : '—';
  const sLast  = student ? esc(student.last)  : '—';
  const sGrade = student ? student.grade : '—';
  const sEmail = student ? esc(student.email) : '—';
  const tFirst = tutor   ? esc(tutor.first) : '—';
  const tLast  = tutor   ? esc(tutor.last)  : '—';
  const tGrade = tutor   ? tutor.grade : '—';
  const tEmail = tutor   ? esc(tutor.email) : '—';
  const teacher = req.supervisingTeacher ? esc(req.supervisingTeacher) : '______________________';

  return `<div class="slip-page">
    <div class="slip-hd">
      <h1>Mary Institute and Saint Louis Country Day School</h1>
      <h2>Peer Tutoring Club &mdash; In-Person Tutoring Session Authorization</h2>
      <p>Academic Year 2025&ndash;2026 &nbsp;|&nbsp; Middle School &amp; Upper School Partnership</p>
    </div>
    <div class="slip-doc-title">Parent / Guardian Permission Slip</div>
    <p class="slip-body-txt">Dear Parent or Guardian,</p>
    <p class="slip-body-txt">Your child has been matched with an Upper School peer tutor through the MICDS Peer Tutoring Club. Please review the details below, complete the signature section, and return the signed form to the supervising teacher <strong>before the session date</strong>.</p>
    <div class="slip-details">
      <div class="detail-row"><span class="detail-key">Date:</span><span class="detail-val">${fmtDate(req.sessionDate)}</span></div>
      <div class="detail-row"><span class="detail-key">Location:</span><span class="detail-val">${esc(req.sessionLocation||'')}</span></div>
      <div class="detail-row"><span class="detail-key">Time:</span><span class="detail-val">${fmtTime(req.sessionStart)} &ndash; ${fmtTime(req.sessionEnd)}</span></div>
      <div class="detail-row"><span class="detail-key">Supervising Teacher:</span><span class="detail-val">${teacher}</span></div>
      <div class="detail-row"><span class="detail-key">Subject(s):</span><span class="detail-val">${req.sharedSubjects.map(esc).join(', ')}</span></div>
    </div>
    <table class="slip-tbl">
      <thead><tr><th>Role</th><th>Full Name</th><th>Grade</th><th>Division</th><th>Email</th></tr></thead>
      <tbody>
        <tr><td><strong>Student (Tutee)</strong></td><td>${sFirst} ${sLast}</td><td>${ordinal(Number(sGrade))} Grade</td><td>Middle School</td><td>${sEmail}</td></tr>
        <tr><td><strong>Peer Tutor</strong></td><td>${tFirst} ${tLast}</td><td>${ordinal(Number(tGrade))} Grade</td><td>Upper School</td><td>${tEmail}</td></tr>
      </tbody>
    </table>
    ${req.sharedInterests&&req.sharedInterests.length ? `<p class="slip-body-txt" style="font-style:italic;font-size:0.82rem"><strong>Shared interests:</strong> ${req.sharedInterests.map(esc).join(', ')} &mdash; considered during pairing to foster a positive mentoring relationship.</p>` : ''}
    <p class="slip-body-txt" style="margin-top:1rem"><strong>By signing below, you authorize your child to attend this supervised, on-campus tutoring session.</strong></p>
    <div class="slip-checks">
      <div class="chk-row"><span class="chk-box"></span><span>I understand this is a faculty-supervised, on-campus session within MICDS facilities.</span></div>
      <div class="chk-row"><span class="chk-box"></span><span>I grant permission for my child's name, grade, and email to be shared with the assigned tutor.</span></div>
      <div class="chk-row"><span class="chk-box"></span><span>I understand my child must be picked up by the end time stated above.</span></div>
    </div>
    <div class="slip-sigs">
      <div><div class="sig-spc"></div><div class="sig-line">Parent / Guardian &mdash; Printed Name</div><div class="sig-spc"></div><div class="sig-line">Parent / Guardian &mdash; Signature &amp; Date</div></div>
      <div><div class="sig-spc"></div><div class="sig-line">Student &mdash; Signature &amp; Date</div><div class="sig-spc"></div><div class="sig-line">Supervising Teacher &mdash; Signature &amp; Date</div></div>
    </div>
    <div class="slip-footer">MICDS Peer Tutoring Club &nbsp;&bull;&nbsp; Return signed form to ${teacher!=='______________________'?teacher:'the supervising teacher'} &nbsp;&bull;&nbsp; Questions? Contact the club advisor.</div>
  </div>`;
}

function printSlip(reqId) {
  const req     = db.reqs().find(r=>r.id===reqId);
  if (!req) return;
  const student = db.users().find(u=>u.id===req.studentId);
  const tutor   = db.users().find(u=>u.id===req.tutorId);
  const area    = document.getElementById('slip-print-area');
  area.innerHTML = slipHTML(req, student, tutor);
  window.print();
}
